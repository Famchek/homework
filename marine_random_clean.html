  }

  }

    border-radius: 10px;
    padding: 13px 16px;
    font-size: 15px;
    font-weight: 600;
    color: #f8fafc;
    text-align: left;
    cursor: pointer;
    transition: all 0.15s;
  }

    background: #162238;
  }
  .opt-btn.correct {

    border-color: #4ade80;
    color: #ffffff;
  }
  .opt-btn.wrong {
    background: #450a0a;
    border-color: #f87171;
    color: #fca5a5;
  }
  .next-btn {

    color: #ffffff;
    border: none;
    padding: 14px;
    border-radius: 10px;

function shuffle(arr) {
  const copy = arr.slice();
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

let questions = [];
let idx = 0;
let correct = 0;

function initQuiz() {
  const pool = shuffle(items);
  questions = pool.map(item => {
    const isEnToRu = Math.random() < 0.5;
    const prompt = isEnToRu ? item.en.join(" / ") : item.ru.join(", ");
    const rightAns = isEnToRu ? item.ru.join(", ") : item.en.join(" / ");
    const distractors = shuffle(items.filter(x => x !== item))
      .slice(0, 3)
      .map(x => isEnToRu ? x.ru.join(", ") : x.en.join(" / "));
    return {
      isEnToRu,
      prompt,
      rightAns,
      options: shuffle([rightAns, ...distractors])
    };
  });
}

function renderQuestion() {
  const q = questions[idx];
  document.getElementById("q-counter").textContent = `Вопрос ${idx + 1} из ${questions.length}`;
  document.getElementById("score-box").textContent = `Верно: ${correct}`;

  const badge = document.getElementById("mode-badge");
  if (q.isEnToRu) {
    badge.className = "badge badge-en-ru";
    badge.textContent = "🇬🇧 ➔ 🇷🇺 ВЫБЕРИ ПЕРЕВОД";
  } else {
    badge.className = "badge badge-ru-en";
    badge.textContent = "🇷🇺 ➔ 🇬🇧 ВЫБЕРИ ТЕРМИН";
  }

  document.getElementById("target-word").textContent = q.prompt;
  const list = document.getElementById("options-list");
  list.innerHTML = "";

  q.options.forEach(opt => {
    const btn = document.createElement("button");
    btn.className = "opt-btn";
    btn.textContent = opt;
    btn.onclick = () => selectOption(btn, opt, q.rightAns);
    list.appendChild(btn);
  });

  document.getElementById("next-btn").style.display = "none";
}

function selectOption(clickedBtn, chosen, rightAns) {
  const allBtns = document.querySelectorAll(".opt-btn");
  allBtns.forEach(b => {
    b.disabled = true;
    if (b.textContent === rightAns) {
      b.classList.add("correct");
    }
  });
  if (chosen === rightAns) {
    correct++;
    document.getElementById("score-box").textContent = `Верно: ${correct}`;
  } else {
    clickedBtn.classList.add("wrong");
  }
  document.getElementById("next-btn").style.display = "block";
}

function nextQuestion() {
  idx++;
  if (idx < questions.length) {
    renderQuestion();
  } else {
    document.getElementById("quiz-card").innerHTML = `
      <h2 style="color: #38bdf8; font-size: 24px; margin-bottom: 12px;">Тест завершён!</h2>
      <p style="font-size: 18px; margin-bottom: 20px;">Правильных ответов: <b>${correct} из ${questions.length}</b></p>
      <button class="next-btn" style="display:block;" onclick="location.reload()">Пройти заново</button>
    `;
  }
}

initQuiz();
renderQuestion();
</script>
