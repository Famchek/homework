<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Морской рандомайзер ⚓</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #090d16;
    color: #f8fafc;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 16px;
  }
  .card {
    background: #151f32;
    border: 1px solid #1e293b;
    padding: 24px;
    border-radius: 16px;
    max-width: 500px;
    width: 100%;
    box-shadow: 0 12px 40px rgba(0,0,0,0.6);
  }
  .top-bar {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: #94a3b8;
    margin-bottom: 12px;
  }
  .badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    background: #0369a1;
    color: #e0f2fe;
    margin-bottom: 14px;
  }
  .word {
    font-size: 24px;
    font-weight: 800;
    margin-bottom: 22px;
    color: #ffffff;
    min-height: 64px;
    display: flex;
    align-items: center;
    line-height: 1.3;
  }
  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  button.option {
    background: #1e293b;
    border: 2px solid #334155;
    color: #f8fafc;
    padding: 14px 16px;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
    text-align: left;
    transition: all 0.15s ease;
  }
  button.option:hover:not(:disabled) {
    background: #27354f;
    border-color: #38bdf8;
  }
  button.correct {
    background: #15803d !important;
    border-color: #4ade80 !important;
    color: #ffffff !important;
  }
  button.wrong {
    background: #b91c1c !important;
    border-color: #f87171 !important;
    color: #ffffff !important;
  }
  .feedback {
    margin-top: 14px;
    font-size: 15px;
    font-weight: 600;
    min-height: 22px;
  }
  .feedback.good { color: #4ade80; }
  .feedback.bad { color: #f87171; }
  .next-btn {
    margin-top: 16px;
    width: 100%;
    background: #0284c7;
    border: none;
    color: white;
    padding: 14px;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    display: none;
  }
  .next-btn:hover { background: #0369a1; }
  .result-title { font-size: 24px; color: #38bdf8; margin: 0 0 10px 0; }
</style>
</head>
<body>

<div class="card" id="quiz-box">
  <div class="top-bar">
    <span id="progress">Вопрос 1 / 30</span>
    <span id="streak">🔥 Стрик: 0 | Очки: 0</span>
  </div>
  <div class="badge" id="direction-badge">🇷🇺 ➔ 🇬🇧 ПЕРЕВОДИ НА АНГЛИЙСКИЙ</div>
  <div class="word" id="word-text">Загрузка...</div>
  <div class="options" id="options-box"></div>
  <div class="feedback" id="feedback"></div>
  <button class="next-btn" id="next-btn" onclick="nextQuestion()">Дальше ➔</button>
</div>

<script>
// Словарь: 30 морских терминов
const vocabulary = [
  { ru: "люк", en: "hatch" },
  { ru: "грузовая стрела", en: "derrick" },
  { ru: "бортовая цистерна", en: "wing tank" },
  { ru: "второе дно", en: "tanktop" },
  { ru: "междудонная цистерна", en: "double bottom tank" },
  { ru: "стойка, мачта", en: "post" },
  { ru: "кормовой, самый задний", en: "rearmost" },
  { ru: "лебедка", en: "winch" },
  { ru: "форштевень", en: "stem" },
  { ru: "набор корпуса судна", en: "framing" },
  { ru: "обшивка, настил", en: "plating" },
  { ru: "левый борт", en: "port" },
  { ru: "правый борт", en: "starboard" },
  { ru: "переборка", en: "bulkhead" },
  { ru: "отсек", en: "compartment" },
  { ru: "продольный (с носа до кормы)", en: "fore and aft" },
  { ru: "прогулочная палуба", en: "promenade deck" },
  { ru: "крен (на 'l')", en: "list" },
  { ru: "крен; наклонять(ся) (на 'h')", en: "heel" },
  { ru: "дифферент", en: "trim" },
  { ru: "решетка, гребень", en: "grid" },
  { ru: "ют", en: "poop" },
  { ru: "форпик", en: "forepeak" },
  { ru: "ахтерпик", en: "afterpeak" },
  { ru: "марки углубления", en: "draught marks" },
  { ru: "давление текучей среды", en: "fluid pressure" },
  { ru: "неправильная нагрузка", en: "faulty loading" },
  { ru: "вдоль и поперек", en: "across the ship and along" },
  { ru: "водонепроницаемый", en: "watertight" },
  { ru: "мостик, средняя надстройка", en: "bridge" }
];

function shuffle(arr) {
  return arr.slice().sort(() => Math.random() - 0.5);
}

// Генерируем 30 вопросов: случайный порядок, случайное направление (ru->en или en->ru)
let deck = [];
let currentIndex = 0;
let score = 0;
let streak = 0;

function initDeck() {
  const shuffledVocab = shuffle(vocabulary);
  deck = shuffledVocab.map(item => {
    const isRuToEn = Math.random() < 0.5;
    const question = isRuToEn ? item.ru : item.en;
    const answer = isRuToEn ? item.en : item.ru;
    
    // Подбираем 3 ложных варианта из того же языка
    const otherPool = vocabulary
      .filter(v => (isRuToEn ? v.en : v.ru) !== answer)
      .map(v => isRuToEn ? v.en : v.ru);
    const distractors = shuffle(otherPool).slice(0, 3);
    const options = shuffle([answer, ...distractors]);

    return {
      type: isRuToEn ? "🇷🇺 ➔ 🇬🇧 ПЕРЕВОДИ НА АНГЛИЙСКИЙ" : "🇬🇧 ➔ 🇷🇺 ПЕРЕВОДИ НА РУССКИЙ",
      question,
      answer,
      options
    };
  });
}

function loadCard() {
  const q = deck[currentIndex];
  document.getElementById("progress").textContent = `Вопрос ${currentIndex + 1} / ${deck.length}`;
  document.getElementById("streak").textContent = `🔥 Стрик: ${streak} | Очки: ${score}`;
  document.getElementById("direction-badge").textContent = q.type;
  document.getElementById("word-text").textContent = q.question;
  document.getElementById("feedback").textContent = "";
  document.getElementById("feedback").className = "feedback";
  document.getElementById("next-btn").style.display = "none";

  const container = document.getElementById("options-box");
  container.innerHTML = "";

  q.options.forEach(opt => {
    const btn = document.createElement("button");
    btn.className = "option";
    btn.textContent = opt;
    btn.onclick = () => answer(btn, opt, q.answer);
    container.appendChild(btn);
  });
}

function answer(btn, chosen, correct) {
  const buttons = document.querySelectorAll("#options-box button");
  buttons.forEach(b => b.disabled = true);
  const fb = document.getElementById("feedback");

  if (chosen === correct) {
    btn.classList.add("correct");
    score++;
    streak++;
    fb.className = "feedback good";
    fb.textContent = "Верно!";
  } else {
    btn.classList.add("wrong");
    streak = 0;
    fb.className = "feedback bad";
    buttons.forEach(b => {
      if (b.textContent === correct) b.classList.add("correct");
    });
    fb.textContent = `Неверно. Правильно: «${correct}»`;
  }

  document.getElementById("streak").textContent = `🔥 Стрик: ${streak} | Очки: ${score}`;
  document.getElementById("next-btn").style.display = "block";
}

function nextQuestion() {
  currentIndex++;
  if (currentIndex < deck.length) {
    loadCard();
  } else {
    renderEnd();
  }
}

function renderEnd() {
  document.getElementById("quiz-box").innerHTML = `
    <h2 class="result-title">Тест завершён! 🎉</h2>
    <p style="font-size: 18px; margin: 12px 0;">Правильных ответов: <b>${score}</b> из <b>${deck.length}</b></p>
    <button class="next-btn" style="display:block; margin-top:20px;" onclick="restart()">Пройти ещё раз (вопросы перемешаются)</button>
  `;
}

function restart() {
  location.reload();
}

initDeck();
loadCard();
</script>

</body>
</html>
