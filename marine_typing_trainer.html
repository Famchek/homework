    color: #f1f5f9;

  }
  .card {

    border: 1px solid #1e2e4f;
    border-radius: 16px;
    max-width: 520px;
    width: 100%;
    padding: 24px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7);
  }
  .top-stats {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    font-size: 14px;
    font-weight: 600;
  }
  .counter { color: #94a3b8; }
  .score { color: #38bdf8; }
  .badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 12px;
  }
  .badge-ru-en { background: #0284c7; color: #ffffff; }
  .badge-en-ru { background: #0d9488; color: #ffffff; }

  .prompt-label {
    font-size: 13px;
    color: #94a3b8;
    margin-bottom: 8px;
    text-transform: uppercase;
    font-weight: 700;
  }
  .target-word {
    font-size: 24px;
    font-weight: 800;
    line-height: 1.35;
    margin-bottom: 20px;
    color: #ffffff;
    min-height: 50px;
    display: flex;
    align-items: center;
  }
  .input-wrap {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  input[type="text"] {
    background: #0d1524;
    border: 2px solid #334155;
    border-radius: 10px;
    padding: 14px 16px;
    font-size: 16px;
    color: #ffffff;
    outline: none;
    transition: border-color 0.2s, background 0.2s;
  }
  input[type="text"]:focus {
    border-color: #38bdf8;
  }
  .submit-btn {
    background: #0284c7;
    border: none;
    color: white;
    padding: 14px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s;
  }
  .submit-btn:hover { background: #0369a1; }

  .feedback-box {
    margin-top: 14px;
    font-size: 15px;
    font-weight: 600;
    min-height: 22px;
    line-height: 1.4;
  }
  .fb-good { color: #4ade80; }
  .fb-bad { color: #f87171; }

  .next-action-btn {
    margin-top: 16px;
    width: 100%;
    background: #38bdf8;
    color: #041226;
    border: none;
    padding: 14px;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    display: none;
  }
  .next-action-btn:hover { background: #7dd3fc; }
</style>

  <div class="input-wrap">

    <button class="submit-btn" id="check-btn" onclick="checkAnswer()">Проверить ➔</button>

  <button class="next-action-btn" id="next-btn" onclick="nextCard()">Дальше ➔</button>

function shuffle(arr) {
  return arr.slice().sort(() => Math.random() - 0.5);
}

function cleanStr(s) {
  return s.toLowerCase().trim().replace(/ё/g, "е").replace(/[^a-zа-я0-9\s']/gi, "").replace(/\s+/g, " ");
}

let cards = [];
let currentIndex = 0;
let correctCount = 0;

function initCards() {
  const shuffledVocab = shuffle(items);
  cards = shuffledVocab.map(item => {
    const isRuToEn = Math.random() < 0.5;
    return {
      isRuToEn,
      promptWord: isRuToEn ? item.ru.join(" / ") : item.en.join(" / "),
      validAnswers: isRuToEn ? item.en : item.ru,
      displayAnswer: isRuToEn ? item.en.join(" / ") : item.ru.join(" / ")
    };
  });
}

function renderCard() {
  const c = cards[currentIndex];
  document.getElementById("q-counter").textContent = `Слово ${currentIndex + 1} / ${cards.length}`;
  document.getElementById("score-box").textContent = `Верно: ${correctCount} / ${cards.length}`;

  const badge = document.getElementById("mode-badge");
  if (c.isRuToEn) {
    badge.className = "badge badge-ru-en";
    badge.textContent = "🇷🇺 ➔ 🇬🇧 ПИШИ НА АНГЛИЙСКОМ";
  } else {
    badge.className = "badge badge-en-ru";
    badge.textContent = "🇬🇧 ➔ 🇷🇺 ПИШИ НА РУССКОМ";
  }

  document.getElementById("prompt-label").textContent = c.isRuToEn ? "Введи морской термин по-английски:" : "Введи перевод по-русски:";
  document.getElementById("target-word").textContent = c.promptWord;

  const inp = document.getElementById("user-input");
  inp.value = "";
  inp.disabled = false;
  inp.style.borderColor = "#334155";
  inp.focus();

  document.getElementById("check-btn").disabled = false;
  document.getElementById("feedback").textContent = "";
  document.getElementById("feedback").className = "feedback-box";
  document.getElementById("next-btn").style.display = "none";
}

function checkAnswer() {
  const inp = document.getElementById("user-input");
  if (!inp || inp.disabled) return;

  const userVal = cleanStr(inp.value);
  if (!userVal) return;

  inp.disabled = true;
  document.getElementById("check-btn").disabled = true;

  const c = cards[currentIndex];
  const isMatch = c.validAnswers.some(ans => cleanStr(ans) === userVal);
  const fb = document.getElementById("feedback");

  if (isMatch) {
    correctCount++;
    inp.style.borderColor = "#4ade80";
    fb.className = "feedback-box fb-good";
    fb.textContent = "Верно!";
  } else {
    inp.style.borderColor = "#f87171";
    fb.className = "feedback-box fb-bad";
    fb.textContent = `Неверно. Правильно: «${c.displayAnswer}»`;
  }

  document.getElementById("score-box").textContent = `Верно: ${correctCount} / ${cards.length}`;
  document.getElementById("next-btn").style.display = "block";
  document.getElementById("next-btn").focus();
}

function nextCard() {
  currentIndex++;
  if (currentIndex < cards.length) {
    renderCard();
  } else {
    document.getElementById("trainer-card").innerHTML = `
      <h2 style="color: #38bdf8; font-size: 24px; margin-bottom: 12px;">Все 62 слова пройдены!</h2>
      <p style="font-size: 18px; margin-bottom: 16px;">Правильных ответов: <b>${correctCount}</b> из <b>${cards.length}</b></p>
      <button class="next-action-btn" style="display:block;" onclick="location.reload()">Пройти заново (перемешать)</button>
    `;
  }
}

document.getElementById("user-input").addEventListener("keypress", function(e) {
  if (e.key === "Enter") {
    checkAnswer();
  }
});

initCards();
renderCard();
